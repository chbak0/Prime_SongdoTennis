# Supabase 무료 프로젝트는 일주일 동안 요청이 없으면 '쉬는 중'으로 멈춘다.
# 3일마다 keepalive() 함수를 한 번 불러서 깨워 두고, 한 달에 한 번 기록을 남겨
# 공개 저장소의 자동 실행이 60일 뒤 꺼지는 것도 막는다.
# 주소와 sb_publishable_ 공개 키는 설치 파일에도 들어 있는 공개용 값이라 여기 그대로 적는다(비밀값 설정 필요 없음).
# 표는 RLS로 막혀 있고 공개 키로는 정해진 함수만 부를 수 있다.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 21 */3 * *"   # 3일마다 (한국 시간 06:17)
    - cron: "41 0 1 * *"      # 매달 1일: 기록 남기기
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase 깨우기
        env:
          SUPABASE_URL: https://mappwltubriilblowcyq.supabase.co
          SUPABASE_KEY: sb_publishable_cuBB1cxdIvq55rplF9XSOw_2IpOs2uV
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 SUPABASE_URL, SUPABASE_KEY 를 넣어 주세요"
            exit 1
          fi
          # 붙여넣을 때 섞인 공백·줄바꿈·따옴표 제거
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d ' \r\n"'"'"'')
          SUPABASE_KEY=$(printf '%s' "$SUPABASE_KEY" | tr -d ' \r\n"'"'"'')
          echo "주소: ${SUPABASE_URL}  키: ${SUPABASE_KEY:0:15}… (${#SUPABASE_KEY}자)"
          case "$SUPABASE_KEY" in sb_publishable_*|eyJ*) ;; *) echo "::error::SUPABASE_KEY가 sb_publishable_ 로 시작하지 않아요(값이 바뀌어 들어간 듯)"; exit 1;; esac
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
            echo "시도 $i: HTTP $code $(cat out.json)"
            [ "$code" = "200" ] && exit 0
            [ "$code" = "401" ] && break
            sleep 20
          done
          [ "$code" = "401" ] && echo "::error::키가 틀렸어요(401) · Supabase > Project Settings > API Keys 의 Publishable key를 복사해 SUPABASE_KEY 비밀값을 다시 넣어 주세요(주소도 같은 프로젝트인지 확인)" && exit 1
          echo "::error::Supabase 응답 $code · 프로젝트가 멈췄으면 Supabase 화면에서 Restore, 함수가 없으면 setup.sql 최신본을 실행해 주세요"
          exit 1

  stamp:
    if: github.event.schedule == '41 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 한 달에 한 번 기록(공개 저장소 자동 실행이 꺼지지 않게)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-stamp
          git commit -m "chore: monthly keepalive stamp" || exit 0
          git push
